---
name: Linting

on: # yamllint disable-line rule:truthy
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  js-lint:
    name: JS Lint
    uses: fabasoad/reusable-workflows/.github/workflows/wf-js-lint.yml@4e2279474e598bee3ae8ded28899a24bbc7bf971 # main
  pre-commit:
    name: Pre-commit
    uses: fabasoad/reusable-workflows/.github/workflows/wf-pre-commit.yml@4e2279474e598bee3ae8ded28899a24bbc7bf971 # main
    with:
      skip-hooks: "audit, build, lint, test"
