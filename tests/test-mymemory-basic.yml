name: Test MyMemory provider basic translation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          provider: mymemory
          lang: "en|it"
          source: "Hello"
      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.text }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ACTUAL" ]; then
              echo "FAIL: action succeeded but output 'text' is empty"
              exit 1
            fi
            echo "PASS: action succeeded with output: $ACTUAL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "INFO: action failed (likely network unavailable in test environment) - skipping assertion"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
