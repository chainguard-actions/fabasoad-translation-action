---
name: Test file path as source input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: translate
        uses: .
        with:
          source: "${{ github.workspace }}/pristine/fabasoad--translation-action/v4.2.2/tests/fixtures/hello.txt"
          provider: mymemory
          lang: "en|it"
      - name: Assert output is not empty
        env:
          ACTUAL: ${{ steps.translate.outputs.text }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty translated text from file source"
            exit 1
          fi
          echo "PASS: got translated text from file: $ACTUAL"
