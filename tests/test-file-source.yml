---
name: Test file source reading
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create source file
        run: |
          echo "Love" > "$GITHUB_WORKSPACE/source.txt"
      - id: translate
        uses: .
        with:
          source: "source.txt"
          provider: "mymemory"
          lang: "en|pt"
      - name: Assert output is non-empty
        env:
          ACTUAL: ${{ steps.translate.outputs.text }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty output when source is a file"
            exit 1
          fi
          echo "PASS: got output from file source: $ACTUAL"
