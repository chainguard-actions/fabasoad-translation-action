---
name: Test file source input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up node24 symlink
        run: |
          NODE_BIN="$(command -v node || command -v nodejs || true)"
          if [ -z "$NODE_BIN" ]; then
            echo "ERROR: no node binary found"
            exit 1
          fi
          echo "Node: $NODE_BIN ($($NODE_BIN --version))"
          # Try to create symlink in system PATH locations (works as root in act)
          ln -sf "$NODE_BIN" /usr/local/bin/node24 2>/dev/null || \
            sudo ln -sf "$NODE_BIN" /usr/local/bin/node24 2>/dev/null || \
            ln -sf "$NODE_BIN" /usr/bin/node24 2>/dev/null || \
            sudo ln -sf "$NODE_BIN" /usr/bin/node24 2>/dev/null || true
          # Also add via GITHUB_PATH as fallback
          mkdir -p "$HOME/.local/bin"
          ln -sf "$NODE_BIN" "$HOME/.local/bin/node24"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "node24 setup complete"
      - name: Create source file
        run: |
          echo "Hello" > "$GITHUB_WORKSPACE/source.txt"
          echo "Source file created: $(cat $GITHUB_WORKSPACE/source.txt)"
      - id: action
        uses: .
        with:
          source: "${{ github.workspace }}/source.txt"
          provider: "mymemory"
          lang: "en|fr"
      - name: Assert output text is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.text }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty translated text from file source"
            exit 1
          fi
          echo "PASS: got translated text from file: $ACTUAL"
