---
name: Test translation from file source
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create source file
        run: |
          echo -n "Hello" > /tmp/source.txt
      - id: action
        uses: .
        with:
          source: "/tmp/source.txt"
          provider: "mymemory"
          lang: "en|es"
      - name: Assert output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.text }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty translated text from file source"
            exit 1
          fi
          echo "PASS: got translated text from file: $ACTUAL"
