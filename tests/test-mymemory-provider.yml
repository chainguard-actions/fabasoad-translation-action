---
name: Test MyMemory provider translation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          provider: mymemory
          lang: "en|it"
          source: "Hello"
      - name: Assert output is not empty
        env:
          ACTUAL: ${{ steps.action.outputs.text }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty translated text"
            exit 1
          fi
          echo "PASS: got translated text: $ACTUAL"
      - name: Assert output contains expected Italian translation
        env:
          ACTUAL: ${{ steps.action.outputs.text }}
        run: |
          echo "actual: $ACTUAL"
          LOWER=$(echo "$ACTUAL" | tr '[:upper:]' '[:lower:]')
          if [ "$LOWER" != "ciao" ]; then
            echo "FAIL: expected 'ciao' but got '$LOWER'"
            exit 1
          fi
          echo "PASS"
