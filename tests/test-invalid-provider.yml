---
name: Test invalid provider causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          source: "Hello"
          provider: "unsupported-provider"
          lang: "en|es"
      - name: Assert action failed with invalid provider
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unsupported provider, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported provider"
