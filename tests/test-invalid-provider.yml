---
name: Test invalid provider causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: translate
        uses: .
        continue-on-error: true
        with:
          source: "Hello"
          provider: "unsupported_provider"
          lang: "en|es"
      - name: Assert action failed for invalid provider
        env:
          OUTCOME: ${{ steps.translate.outcome }}
          ACTUAL: ${{ steps.translate.outputs.text }}
        run: |
          echo "outcome: $OUTCOME"
          echo "text output: '$ACTUAL'"
          # The action should fail for an unsupported provider (core.setFailed is called).
          # When the action fails, the 'text' output is not set (empty).
          # We check: outcome is 'failure' OR text output is empty (action did not succeed).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for unsupported provider (outcome=failure)"
          elif [ -z "$ACTUAL" ]; then
            echo "PASS: action did not produce output for unsupported provider"
          else
            echo "FAIL: expected action to fail but got non-empty output: $ACTUAL"
            exit 1
          fi
