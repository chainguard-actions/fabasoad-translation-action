---
name: Test Google provider basic translation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: translate
        uses: .
        with:
          source: "Kemenangan"
          provider: google
          lang: "ms|en"
      - name: Assert output equals expected
        env:
          ACTUAL: ${{ steps.translate.outputs.text }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty translated text"
            exit 1
          fi
          echo "PASS: got translated text: $ACTUAL"
