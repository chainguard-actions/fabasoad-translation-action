---
name: Test basic translation inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          source: "Hello"
          provider: "google"
          lang: "en-fr"
          api_key: ""
      - name: Assert action ran and inputs were accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TEXT: ${{ steps.action.outputs.text }}
        run: |
          echo "outcome: $OUTCOME"
          echo "translated text: $TEXT"
          # The action may fail due to missing/invalid API key, but it must have run
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with source, provider, and lang inputs"
